<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>JANO | Art Discovery System</title>
    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width, height=device-height, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="JANO is an art discovery system to explore artworks, artists, movements, periods, and concepts through immersive visual navigation."
    />
    <meta name="application-name" content="JANO" />
    <meta name="apple-mobile-web-app-title" content="JANO" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#231d1b" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon-48x48.png" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
    <style>
      .jano-boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 38%, rgba(198, 178, 142, 0.12), transparent 28%), #0d0d0d;
        color: #f2f1ee;
      }

      .jano-boot__mark {
        font:
          700 clamp(2rem, 5vw, 3.4rem) / 1 Helvetica,
          Arial,
          sans-serif;
        letter-spacing: 0.32em;
        opacity: 0.82;
        transform: translateX(0.16em);
        animation: jano-boot-pulse 1.2s ease-in-out infinite alternate;
      }

      @keyframes jano-boot-pulse {
        to {
          opacity: 0.5;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .jano-boot__mark {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <app-root>
      <div class="jano-boot" role="status" aria-label="Cargando JANO">
        <span class="jano-boot__mark" aria-hidden="true">JANO</span>
      </div>
    </app-root>
  </body>
</html>
