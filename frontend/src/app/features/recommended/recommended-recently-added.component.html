<section class="recommended-section recommended-section--recent">
  <div class="recommended-section__head recommended-section__head--split">
    <div>
      <div class="recommended-section__titleline">
        <span class="recommended-section__number">7</span>
        <p class="recommended-section__eyebrow">{{ i18n.t('curated.recent.eyebrow') }}</p>
      </div>
      <h2>{{ i18n.t('curated.recent.title') }}</h2>
    </div>
    <span class="recommended-card__meta">{{ i18n.t('search.viewAll') }} →</span>
  </div>

  <app-recommended-entity-shelf
    layout="recent"
    [items]="items()"
    kind="curations"
    [showNewBadge]="true"
  ></app-recommended-entity-shelf>
</section>
