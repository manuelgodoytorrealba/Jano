<section class="recommended-section recommended-section--related recommended-related">
  <div class="recommended-section__head recommended-section__head--split">
    <div>
      <div class="recommended-section__titleline">
        <span class="recommended-section__number">6</span>
        <p class="recommended-section__eyebrow">Related Entities</p>
      </div>
      <h2>Direct graph neighbors</h2>
    </div>
    <span class="recommended-card__meta">See all connections →</span>
  </div>

  <div class="recommended-chip-grid recommended-related__list">
    @for (item of items(); track item.id) {
      <a
        class="recommended-chip recommended-related__item"
        [routerLink]="['/curated']"
        [queryParams]="{ entity: item.slug }"
      >
        <span class="recommended-related__type">{{ typeLabel(item.type) }}</span>
        <strong>{{ item.title }}</strong>
        <p>{{ item.summary ?? typeLabel(item.type) }}</p>
      </a>
    }
  </div>
</section>
