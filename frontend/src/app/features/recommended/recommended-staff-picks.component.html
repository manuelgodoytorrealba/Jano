<section class="recommended-section recommended-section--staff">
  <div class="recommended-section__head">
    <div class="recommended-section__titleline">
      <span class="recommended-section__number">1</span>
      <p class="recommended-section__eyebrow">Staff Picks</p>
    </div>
    <h2>Staff picks for the selected entity</h2>
  </div>

  <div class="recommended-card-row recommended-card-row--three">
    @for (pick of picks(); track pick.id) {
      <a class="recommended-card recommended-card--deck" [routerLink]="['/entities']" [queryParams]="{ deck: pick.slug }">
        @if (pick.image?.url; as imageUrl) {
          <div class="recommended-card__media" [style.background-image]="'url(' + imageUrl + ')'"></div>
        }
        <div class="recommended-card__body">
          <h3>{{ pick.title }}</h3>
          @if (pick.description) {
            <p>{{ pick.description }}</p>
          }
          <div class="recommended-card__meta-row">
            <span>{{ pick.entityCount }} works</span>
            <span>•</span>
            <span>{{ pick.entityCount > 2 ? 6 : 4 }} articles</span>
          </div>
        </div>
      </a>
    }
  </div>
</section>
