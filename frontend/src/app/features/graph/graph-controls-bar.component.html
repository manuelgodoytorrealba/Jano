@if (footerOnly) {
  <div class="graph-footer">
    <div class="graph-footer__progress"><ng-content /></div>
    <div class="surface-controls" role="group" [attr.aria-label]="i18n.t('graph.controls')">
      <button
        type="button"
        class="surface-control"
        [disabled]="!graphReady"
        (click)="centerSelection.emit()"
        [attr.aria-label]="i18n.t('graph.center')"
        [title]="i18n.t('graph.center')"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="7" />
          <circle cx="12" cy="12" r="3" />
          <path d="M12 2v3m0 14v3M2 12h3m14 0h3" />
        </svg>
      </button>
      @if (!isMobileViewport) {
        <button
          type="button"
          class="surface-control"
          [disabled]="!graphReady"
          (click)="zoom(0.88)"
          [attr.aria-label]="i18n.t('graph.zoomOut')"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" /></svg>
        </button>
        <span class="graph-scale">{{ scalePercent }}%</span>
        <button
          type="button"
          class="surface-control"
          [disabled]="!graphReady"
          (click)="zoom(1.14)"
          [attr.aria-label]="i18n.t('graph.zoomIn')"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
        </button>
      }
      <button
        type="button"
        class="surface-control"
        [disabled]="!graphReady"
        (click)="resetGraphView.emit()"
        [attr.aria-label]="i18n.t('graph.reset')"
        [title]="i18n.t('graph.reset')"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 9a7.5 7.5 0 1 1-.4 6" />
          <path d="M5 4v5h5" />
        </svg>
      </button>
    </div>
  </div>
} @else {
  <div class="graph-panel-bar">
    <span class="graph-panel-bar__meta">
      <span>{{ nodeCount }} {{ i18n.t('graph.nodes') }}</span>
      <span>{{ edgeCount }} {{ i18n.t('graph.edges') }}</span>
    </span>
    <div class="graph-panel-bar__toggles">
      <button
        type="button"
        class="graph-utility-btn graph-utility-btn--mode"
        [class.is-active]="labelsMode !== 'hidden'"
        [attr.aria-label]="i18n.t('graph.labels') + ' ' + labelsModeLabel()"
        [title]="i18n.t('graph.labels') + ' ' + labelsModeLabel()"
        (click)="cycleLabelsMode()"
      >
        <span class="graph-utility-btn__symbol" aria-hidden="true">Aa</span>
        <span class="graph-utility-btn__text"
          >{{ i18n.t('graph.labels') }} {{ labelsModeLabel() }}</span
        >
      </button>
      <button
        type="button"
        class="graph-utility-btn graph-utility-btn--images"
        [class.is-active]="imagesEnabled"
        [disabled]="!graphReady"
        [attr.aria-pressed]="imagesEnabled"
        [attr.aria-label]="i18n.t(imagesEnabled ? 'graph.images.hide' : 'graph.images.show')"
        [title]="i18n.t(imagesEnabled ? 'graph.images.hide' : 'graph.images.show')"
        (click)="toggleImages.emit()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="4" width="18" height="16" rx="2" />
          <path d="m3 16 5-5 4 4 4-5 5 6" />
          <circle cx="16" cy="8" r="1" />
        </svg>
      </button>
      <button
        type="button"
        class="graph-utility-btn graph-utility-btn--layers"
        [class.is-active]="inspectorVisible"
        [disabled]="!graphReady"
        (click)="toggleInspector.emit()"
        [attr.aria-label]="i18n.t('graph.layers')"
        [attr.aria-expanded]="inspectorVisible"
        [title]="i18n.t('graph.layers')"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m12 3 9 5-9 5-9-5 9-5Zm-9 9 9 5 9-5M3 16l9 5 9-5" />
        </svg>
      </button>
    </div>
  </div>
}
