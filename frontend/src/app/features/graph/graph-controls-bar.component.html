<div class="graph-panel-bar">
  <div class="graph-panel-bar__group graph-panel-bar__group--primary">
    <div class="explorer-surface-label">Relaciones</div>
  </div>

  <div class="graph-panel-bar__group graph-panel-bar__group--meta">
    <div class="graph-panel-bar__meta">
      <span>{{ nodeCount }} nodos · {{ edgeCount }} relaciones · {{ scalePercent }}%</span>
    </div>
  </div>

  <div class="graph-panel-bar__group graph-panel-bar__group--actions">
    <div class="graph-panel-bar__toggles">
      <button type="button" class="graph-utility-btn graph-utility-btn--mode" (click)="cycleLabelsMode()">
        Etiquetas {{ labelsModeLabel() }}
      </button>
      <button type="button" class="graph-utility-btn" [disabled]="!graphReady" (click)="toggleInspector.emit()">
        Info
      </button>
    </div>

    <div class="surface-controls surface-controls--graph">
      <button type="button" class="surface-control surface-control--text" [disabled]="!graphReady" (click)="centerSelection.emit()">Centrar</button>
      <button type="button" class="surface-control" (click)="zoom(1.14)">+</button>
      <button type="button" class="surface-control" (click)="zoom(0.88)">−</button>
      <button type="button" class="surface-control surface-control--text surface-control--wide" (click)="resetGraphView.emit()">Reset</button>
    </div>
  </div>
</div>
