<svg class="graph-svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="graph-depth-vignette" cx="50%" cy="46%" r="70%">
      <stop offset="0%" stop-color="#16222e" stop-opacity="0" />
      <stop offset="78%" stop-color="#070a10" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#04060a" stop-opacity="0.18" />
    </radialGradient>

    @for (field of ambientFields; track field.id) {
      <radialGradient [attr.id]="field.id + '-gradient'" cx="50%" cy="50%" r="50%">
        <stop
          offset="0%"
          [attr.stop-color]="field.color"
          [attr.stop-opacity]="field.opacity"
        ></stop>
        <stop
          offset="58%"
          [attr.stop-color]="field.color"
          [attr.stop-opacity]="field.opacity * 0.3"
        ></stop>
        <stop offset="100%" [attr.stop-color]="field.color" stop-opacity="0"></stop>
      </radialGradient>
    }

    @for (markerDef of markerDefs; track markerDef.id) {
      <marker
        [attr.id]="markerDef.id"
        markerWidth="11"
        markerHeight="11"
        refX="8"
        refY="4"
        orient="auto"
        markerUnits="strokeWidth"
      >
        <path d="M 0 0 L 8 4 L 0 8 z" [attr.fill]="markerDef.color"></path>
      </marker>
    }
  </defs>

  <g [attr.transform]="viewportTransform">
    <rect
      class="graph-depth-vignette"
      x="-2000"
      y="-2000"
      width="4000"
      height="4000"
      fill="url(#graph-depth-vignette)"
    ></rect>

    @for (field of ambientFields; track field.id) {
      <circle
        class="graph-ambient-field"
        [class.graph-ambient-field--focus]="field.emphasis === 'focus'"
        [class.graph-ambient-field--mid]="field.emphasis === 'mid'"
        [class.graph-ambient-field--far]="field.emphasis === 'far'"
        [attr.cx]="field.x"
        [attr.cy]="field.y"
        [attr.r]="field.radius"
        [attr.fill]="'url(#' + field.id + '-gradient)'"
      ></circle>
    }

    @for (renderedEdge of renderedEdges; track renderedEdge.edge.id) {
      <g
        class="graph-edge-group"
        [class.is-candidate]="renderedEdge.edge.state === 'candidate'"
        [class.graph-edge-group--focus]="renderedEdge.depthTier === 'focus'"
        [class.graph-edge-group--mid]="renderedEdge.depthTier === 'mid'"
        [class.graph-edge-group--far]="renderedEdge.depthTier === 'far'"
      >
        <path
          class="graph-edge graph-edge--aura"
          [attr.d]="renderedEdge.path"
          [attr.stroke]="renderedEdge.relationVisual.color"
          [attr.stroke-width]="renderedEdge.relationVisual.width + 4.5"
          [attr.stroke-dasharray]="renderedEdge.dasharray"
          [class.is-muted]="renderedEdge.muted"
        ></path>

        <path
          class="graph-edge"
          [attr.d]="renderedEdge.path"
          [attr.stroke]="renderedEdge.relationVisual.color"
          [attr.stroke-width]="renderedEdge.relationVisual.width"
          [attr.stroke-dasharray]="renderedEdge.dasharray"
          [attr.marker-end]="
            renderedEdge.edge.directed ? 'url(#' + renderedEdge.markerId + ')' : null
          "
          [class.is-muted]="renderedEdge.muted"
        ></path>

        <path
          class="graph-edge-hit"
          [attr.data-edge-id]="renderedEdge.edge.id"
          [attr.d]="renderedEdge.path"
          vector-effect="non-scaling-stroke"
          (pointerenter)="edgeHover.emit({ event: $event, edge: renderedEdge.edge })"
          (pointermove)="edgeHover.emit({ event: $event, edge: renderedEdge.edge })"
          (pointerup)="edgeActivate.emit({ event: $event, edge: renderedEdge.edge })"
          (pointerleave)="clearHover.emit()"
        ></path>

        @if (edgeLabelVisibility[renderedEdge.edge.id]) {
          <text
            class="graph-edge-label"
            [attr.data-edge-id]="renderedEdge.edge.id"
            [class.is-muted]="renderedEdge.muted"
            [attr.x]="renderedEdge.labelPoint.x"
            [attr.y]="renderedEdge.labelPoint.y"
            (pointerenter)="edgeHover.emit({ event: $event, edge: renderedEdge.edge })"
            (pointermove)="edgeHover.emit({ event: $event, edge: renderedEdge.edge })"
          >
            {{ renderedEdge.displayLabel }}
          </text>
        }
      </g>
    }

    @for (renderedNode of renderedNodes; track renderedNode.node.id) {
      <g
        class="graph-node"
        [style.--node-accent]="renderedNode.nodeVisual.accent"
        [attr.data-node-id]="renderedNode.node.id"
        [class.is-candidate]="renderedNode.node.state === 'candidate'"
        [attr.transform]="renderedNode.transform"
        [class.is-selected]="renderedNode.selected"
        [class.is-muted]="renderedNode.muted"
        [class.graph-node--focus]="renderedNode.depthTier === 'focus'"
        [class.graph-node--mid]="renderedNode.depthTier === 'mid'"
        [class.graph-node--far]="renderedNode.depthTier === 'far'"
        (pointerdown)="nodePointerDown.emit({ event: $event, nodeId: renderedNode.node.id })"
        (pointermove)="nodePointerMove.emit($event); hoverNode($event, renderedNode.node.id)"
        (pointerup)="nodePointerUp.emit({ event: $event, nodeId: renderedNode.node.id })"
        (pointercancel)="nodePointerCancel.emit($event)"
        (pointerenter)="hoverNode($event, renderedNode.node.id)"
        (pointerleave)="leaveNode()"
      >
        <circle
          class="graph-node__halo"
          cx="0"
          cy="0"
          [attr.r]="renderedNode.haloSize"
          [attr.fill]="renderedNode.nodeVisual.halo"
        ></circle>

        <circle
          class="graph-node__echo"
          cx="0"
          cy="0"
          [attr.r]="renderedNode.size * 1.52"
          [attr.fill]="renderedNode.nodeVisual.halo"
        ></circle>

        <path
          class="graph-node__shape"
          [attr.d]="renderedNode.shapePath"
          fill="var(--color-surface, #171c22)"
          [attr.stroke]="renderedNode.nodeVisual.accent"
        ></path>

        <path
          class="graph-node__shape graph-node__shape--inner"
          [attr.d]="renderedNode.shapePath"
          fill="var(--color-surface, #171c22)"
        ></path>

        <path
          class="graph-node__symbol"
          [attr.d]="renderedNode.symbolPath"
          [attr.transform]="'scale(' + renderedNode.size / 18 + ') translate(-12 -12)'"
          [attr.stroke]="renderedNode.nodeVisual.accent"
          fill="none"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
          pointer-events="none"
        />

        @if (renderedNode.imageUrl && !failedImages().has(renderedNode.imageUrl)) {
          <clipPath [attr.id]="'node-image-' + renderedNode.node.id">
            <path [attr.d]="renderedNode.shapePath" />
          </clipPath>
          <foreignObject
            [attr.x]="-renderedNode.size"
            [attr.y]="-renderedNode.size"
            [attr.width]="renderedNode.size * 2"
            [attr.height]="renderedNode.size * 2"
            [attr.clip-path]="'url(#node-image-' + renderedNode.node.id + ')'"
            pointer-events="none"
          >
            <img
              xmlns="http://www.w3.org/1999/xhtml"
              class="graph-node__image"
              [src]="renderedNode.imageUrl"
              alt=""
              loading="lazy"
              decoding="async"
              (error)="imageFailed(renderedNode.imageUrl)"
            />
          </foreignObject>
          <path
            class="graph-node__image-rim"
            [attr.d]="renderedNode.shapePath"
            [attr.stroke]="renderedNode.nodeVisual.accent"
          />
        }

        @if (nodeLabelVisibility[renderedNode.node.id]) {
          <g
            class="graph-node__label"
            [attr.transform]="renderedNode.labelTransform"
            [attr.text-anchor]="renderedNode.labelTextAnchor"
          >
            <text class="graph-node__title" y="-2">{{ renderedNode.titleLabel }}</text>
            <text class="graph-node__subtitle" y="18">{{ renderedNode.typeLabel }}</text>
          </g>
        }
      </g>
    }
  </g>
</svg>

@if (tooltip) {
  <div
    class="graph-tooltip"
    [appGraphTooltipPosition]="tooltip"
    [tooltipAnchorId]="tooltipAnchorId"
    [tooltipCamera]="viewportTransform"
    (anchorHidden)="dismissTooltip.emit()"
    (keydown.escape)="dismissTooltip.emit(); $event.stopPropagation()"
    (pointerenter)="retainTooltip.emit()"
    (focusin)="retainTooltip.emit()"
    (focusout)="clearHover.emit()"
    tabindex="0"
    role="region"
    [attr.aria-label]="tooltip.title"
    (pointerleave)="clearHover.emit()"
    (pointerdown)="$event.stopPropagation()"
    (wheel)="$event.stopPropagation()"
  >
    <div class="graph-tooltip__title">{{ tooltip.title }}</div>
    @if (tooltip.subtitle) {
      <div class="graph-tooltip__subtitle">{{ tooltip.subtitle }}</div>
    }
    @if (tooltip.body) {
      <div class="graph-tooltip__body">{{ tooltip.body }}</div>
    }
  </div>
}
