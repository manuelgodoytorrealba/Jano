<main class="auth-page">
  <section class="auth-card">
    <div class="auth-brand">JANO</div>
    <h1>{{ i18n.t('auth.resetPasswordTitle') }}</h1>
    <p>{{ i18n.t('auth.resetPasswordIntro') }}</p>
    @if (success()) {
      <p class="auth-success" role="status">{{ i18n.t('auth.resetPasswordSuccess') }}</p>
      <a routerLink="/login">{{ i18n.t('auth.login') }}</a>
    } @else {
      <form [formGroup]="form" (ngSubmit)="submit()">
        <label
          ><span>{{ i18n.t('auth.newPassword') }}</span
          ><input
            type="password"
            formControlName="password"
            autocomplete="new-password"
            maxlength="72" /></label
        ><label
          ><span>{{ i18n.t('auth.confirmPassword') }}</span
          ><input
            type="password"
            formControlName="confirmPassword"
            autocomplete="new-password"
            maxlength="72"
        /></label>
        @if (error()) {
          <p class="auth-error" role="alert">{{ error() }}</p>
        }
        <button type="submit" [disabled]="!token || form.invalid || submitting()">
          {{ submitting() ? i18n.t('common.saving') : i18n.t('auth.resetPasswordSubmit') }}
        </button>
      </form>
    }
  </section>
</main>
