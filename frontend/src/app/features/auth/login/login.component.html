<div class="login-background">
  <canvas #canvas></canvas>
</div>

<main class="beta-auth-page">
  <section class="beta-auth-card" aria-labelledby="login-title">
    <div class="beta-auth-card__brand">JANO</div>

    <header class="beta-auth-card__header">
      <h1 id="login-title">{{ i18n.t('auth.loginTitle') }}</h1>
      <p>{{ i18n.t('auth.loginIntro') }}</p>
    </header>

    <form class="beta-auth-form" [formGroup]="form" (ngSubmit)="submit()">
      <label class="beta-auth-field">
        <span>{{ i18n.t('common.email') }}</span>
        <input type="email" formControlName="email" autocomplete="email" />
      </label>

      <a class="beta-auth-forgot" routerLink="/forgot-password">{{
        i18n.t('auth.forgotPassword')
      }}</a>

      <label class="beta-auth-field">
        <span>{{ i18n.t('auth.password') }}</span>
        <input
          type="password"
          formControlName="password"
          autocomplete="current-password"
          maxlength="72"
        />
      </label>

      @if (error) {
        <div class="beta-auth-error" role="alert">{{ error }}</div>
      }

      <button class="beta-auth-submit" type="submit" [disabled]="form.invalid || loading">
        {{ loading ? i18n.t('auth.loggingIn') : i18n.t('auth.login') }}
      </button>
    </form>
  </section>
</main>
