<main class="auth-page">
  <section class="auth-card">
    <div class="auth-brand">JANO</div>
    <h1>{{ i18n.t('auth.forgotPasswordTitle') }}</h1>
    <p>{{ i18n.t('auth.forgotPasswordIntro') }}</p>
    @if (submitted()) {
      <p class="auth-success" role="status">{{ i18n.t('auth.forgotPasswordSuccess') }}</p>
    } @else {
      <form [formGroup]="form" (ngSubmit)="submit()">
        <label
          ><span>{{ i18n.t('common.email') }}</span
          ><input type="email" formControlName="email" autocomplete="email"
        /></label>
        @if (error()) {
          <p class="auth-error" role="alert">{{ i18n.t('auth.forgotPasswordError') }}</p>
        }
        <button type="submit" [disabled]="form.invalid || submitting()">
          {{ submitting() ? i18n.t('common.sending') : i18n.t('auth.sendResetLink') }}
        </button>
      </form>
    }
    <a routerLink="/login">{{ i18n.t('auth.backToLogin') }}</a>
  </section>
</main>
