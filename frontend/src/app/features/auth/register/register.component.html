<div class="login-background"><canvas #canvas></canvas></div>

<main class="beta-auth-page">
  <section class="beta-auth-card" aria-labelledby="register-title">
    <div class="beta-auth-card__brand">JANO</div>

    <header class="beta-auth-card__header">
      <h1 id="register-title">{{ i18n.t('auth.registerTitle') }}</h1>
      <p>{{ i18n.t('auth.registerIntro') }}</p>
    </header>

    <form class="beta-auth-form" [formGroup]="form" (ngSubmit)="submit()">
      <label class="beta-auth-field">
        <span>{{ i18n.t('auth.registerName') }}</span>
        <input type="text" formControlName="name" autocomplete="name" maxlength="80" />
      </label>

      <label class="beta-auth-field">
        <span>{{ i18n.t('common.email') }}</span>
        <input type="email" formControlName="email" autocomplete="email" />
      </label>

      <label class="beta-auth-field">
        <span>{{ i18n.t('auth.password') }}</span>
        <input
          type="password"
          formControlName="password"
          autocomplete="new-password"
          maxlength="72"
        />
      </label>

      @if (error) {
        <div class="beta-auth-error" role="alert">{{ error }}</div>
      }

      <button class="beta-auth-submit" type="submit" [disabled]="form.invalid || loading">
        {{ loading ? i18n.t('auth.registering') : i18n.t('auth.registerSubmit') }}
      </button>
    </form>

    <p class="beta-auth-foot">
      {{ i18n.t('auth.registerExisting') }}
      <a routerLink="/login">{{ i18n.t('auth.registerLoginLink') }}</a
      >.
    </p>
  </section>
</main>
