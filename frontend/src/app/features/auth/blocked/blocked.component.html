<main class="beta-auth-page">
  <section class="beta-auth-card" aria-labelledby="blocked-title">
    <div class="beta-auth-card__brand">JANO</div>

    <header class="beta-auth-card__header">
      <h1 id="blocked-title">{{ i18n.t('auth.blockedTitle') }}</h1>
      <p>{{ i18n.t('auth.blockedCopy') }}</p>
    </header>

    <button class="beta-auth-submit" type="button" (click)="logout()">
      {{ i18n.t('auth.backToLogin') }}
    </button>
  </section>
</main>
