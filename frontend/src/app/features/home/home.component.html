<section class="home-page">
  <app-entity-deck
    class="home-page__deck"
    [items]="deckItems"
    [backgroundImage]="'/assets/home/museum-room.jpg'"
    [showRail]="false"
    [showDots]="true"
    [showNav]="true"
    [showBottomSearch]="false"
    [fullViewport]="true"
    (cardClick)="onCardClick($event)"
    (expandClick)="onExpandClick($event)"
  />
</section>
