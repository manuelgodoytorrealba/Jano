<div
    #root
    class="explorer3d"
    role="region"
    aria-label="Explorer 3D de entidades"
    (mouseenter)="onMouseEnter()"
    (mouseleave)="onMouseLeave()"
>
    <div #canvasHost class="explorer3d__canvas"></div>

    @if (activeItem; as active) {
    <button
        class="explorer3d__info-toggle"
        [class.is-visible]="!infoOpen"
        type="button"
        (click)="openInfoPanel()"
        [attr.aria-label]="'Mostrar información de ' + active.title"
    >
        <span aria-hidden="true">i</span>
    </button>

    <aside class="explorer3d__info" [class.is-hidden]="!infoOpen" [attr.aria-hidden]="!infoOpen">
        <button
            class="explorer3d__info-close"
            type="button"
            (click)="closeInfoPanel()"
            aria-label="Cerrar información"
        >
            <span aria-hidden="true">×</span>
        </button>

        <div class="explorer3d__eyebrow">JANO Explorer</div>

        <h2 class="explorer3d__title">{{ active.title }}</h2>

        <div class="explorer3d__meta">
            <span>{{ active.type }}</span>
            @if (active.status) { <span>{{ active.status }}</span> }
            @if (active.contentLevel) { <span>{{ active.contentLevel }}</span> }
        </div>

        @if (active.summary) {
        <p class="explorer3d__summary">{{ cleanWiki(active.summary) }}</p>
        }

        <button class="ds-btn explorer3d__cta" type="button" (click)="openActive()">
            Abrir entidad
        </button>
    </aside>
    }
</div>
