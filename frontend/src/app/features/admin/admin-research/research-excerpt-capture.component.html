<aside class="research-excerpt" aria-label="Nuevo Library Excerpt">
  <header>
    <div>
      <p>Library</p>
      <h3>Nuevo extracto</h3>
    </div>
    <button
      type="button"
      class="research-excerpt__close"
      (click)="cancelled.emit()"
      aria-label="Cerrar"
    >
      ×
    </button>
  </header>

  <form (ngSubmit)="save()">
    <label>
      <span>Fuente</span>
      <output>{{ sourceTitle }}</output>
    </label>
    <label>
      <span>Localizador</span>
      <input name="excerptLocator" [(ngModel)]="locator" placeholder="Posición verificable" />
    </label>
    <label>
      <span>Cita</span>
      <textarea name="excerptText" [(ngModel)]="text" placeholder="Pasaje verificable"></textarea>
    </label>
    @if (error) {
      <span class="research-excerpt__error">{{ error }}</span>
    }
    <footer>
      <button type="button" class="research-excerpt__cancel" (click)="cancelled.emit()">
        Cancelar
      </button>
      <button type="submit" [disabled]="busy || !locator.trim() || !text.trim()">
        {{ busy ? 'Guardando…' : 'Guardar extracto' }}
      </button>
    </footer>
  </form>
</aside>
