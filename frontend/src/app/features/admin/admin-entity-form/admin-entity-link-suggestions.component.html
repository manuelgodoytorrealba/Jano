@if (visible) {
  <div class="link-suggestions" (mousedown)="$event.preventDefault()">
    @if (loading) {
      <div class="link-suggestion muted">Buscando entities…</div>
    } @else if (items.length) {
      @for (item of items; track item.id) {
        <button type="button" class="link-suggestion" (click)="selectItem.emit(item)">
          <strong>{{ item.title }}</strong>
          <span>{{ item.type }} · {{ item.slug }}</span>
        </button>
      }
    } @else {
      <div class="link-suggestion muted">No se encontraron entities para "{{ query }}"</div>
    }
  </div>
}
