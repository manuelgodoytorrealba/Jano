<div class="page">
  @if (facade.loadError()) {
    <div class="error-box">{{ facade.loadError() }}</div>
  }

  <section class="editor-layout" [class.editor-layout--sidebar-open]="shell.sidebarVisible">
    <app-admin-entity-sidebar
      [visible]="shell.sidebarVisible"
      [title]="form.title"
      [saveStatusLabel]="entitySaveStatus.label"
      [saveStatusClass]="entitySaveStatus.className"
      [cancelHref]="shell.cancelHref(form.type)"
      [saveStayLabel]="entitySaveButtonLabel('stay')"
      [saveBackLabel]="entitySaveButtonLabel('back')"
      [saveDisabled]="facade.saving() || facade.loading()"
      [loading]="facade.loading()"
      [navItems]="sidebarSections"
      [discoverabilityScoreLabel]="discoverabilityModel.scoreLabel"
      [discoverabilityTone]="discoverabilityModel.tone"
      [discoverabilitySummary]="discoverabilityModel.summary"
      [discoverabilityItems]="discoverabilityModel.items"
      [publishWarning]="discoverabilityModel.publishWarning"
      (toggleSidebar)="toggleAdminSidebar()"
      (saveStay)="submit('stay')"
      (saveBack)="submit('back')"
      (selectSection)="scrollToSection($event)"
      [isEdit]="shell.isEdit"
    ></app-admin-entity-sidebar>

    <section class="form-wrap">
      @if (facade.errorMessage()) {
        <div class="error-box">{{ facade.errorMessage() }}</div>
      }
      @if (facade.successMessage()) {
        <div class="success-box">{{ facade.successMessage() }}</div>
      }

      <app-admin-entity-preview
        [active]="isActiveSection('section-preview')"
        [ready]="!shell.isEdit || initialEntityHydrated"
        [stateKey]="previewStateKey()"
        [entityId]="shell.entityId"
        [locale]="i18n.locale()"
        [form]="form"
        [translations]="translationForms"
        [details]="detailsForm"
        [localizedDetails]="localizedDetailForms"
        [entityTags]="entityTags"
        [relations]="relations"
        [incomingRelations]="incomingRelations"
        [sourceRefs]="sourceRefs"
        [contributors]="contributors"
        [mediaEditors]="mediaEditors"
        [persistedResolvedMedia]="persistedResolvedMedia"
        [resolvedVisualSlots]="resolvedVisualSlots"
      ></app-admin-entity-preview>

      <app-admin-entity-global-data
        [active]="isActiveSection('section-content')"
        [isEdit]="shell.isEdit"
        [entityId]="shell.entityId"
        [form]="form"
        [translations]="translationForms"
        [localizedDetails]="localizedDetailForms"
        [details]="detailsForm"
        [tags]="entityTags"
        [aliases]="entityAliases"
        (draftChange)="onGlobalDataDraftChange($event)"
        (translationSaved)="onTranslationSaved($event)"
        (detailsSaved)="onDetailsSaved($event)"
        (detailsStatusChange)="onDetailsStatusChange($event)"
      ></app-admin-entity-global-data>

      <app-admin-entity-media-library
        [active]="isActiveSection('section-media')"
        [isEdit]="shell.isEdit"
        [entityTitle]="form.title"
        [mediaEditors]="mediaEditors"
        [persistedMediaLinks]="persistedMediaLinks"
        [resolvedVisualSlots]="resolvedVisualSlots"
        [additionalMediaItems]="additionalMediaItems"
        [mediaWarningsDetailed]="mediaWarningsDetailed"
        [mediaWarningMessages]="mediaWarningMessages"
        [mediaCoverageSummary]="mediaCoverageSummary"
        [persistedResolvedMedia]="persistedResolvedMedia"
        [entityId]="shell.entityId"
        [initialActiveEditorId]="activeMediaEditorId"
        [adding]="addingMedia"
        [uploading]="uploadingMedia"
        [addResetVersion]="mediaAddResetVersion"
        [message]="mediaMessage"
        [error]="mediaError"
        (stateChange)="onMediaLibraryStateChange($event)"
      ></app-admin-entity-media-library>

      @if (shell.isEdit) {
        <app-admin-entity-sources-editor
          [entityId]="shell.entityId"
          [active]="isActiveSection('section-sources')"
          [sourceRefs]="sourceRefs"
          (stateChange)="onSourcesStateChange($event)"
        ></app-admin-entity-sources-editor>

        <app-admin-entity-contributors-editor
          [entityId]="shell.entityId"
          [active]="isActiveSection('section-contributors')"
          [contributors]="contributors"
          (stateChange)="onContributorsStateChange($event)"
        ></app-admin-entity-contributors-editor>
      }

      @if (shell.isEdit) {
        <app-admin-entity-relations-editor
          [entityId]="shell.entityId"
          [active]="isActiveSection('section-relations')"
          (stateChange)="onRelationsStateChange($event)"
        ></app-admin-entity-relations-editor>
      }
    </section>
  </section>
</div>
