<section
  id="section-content"
  class="admin-dashboard-panel"
  [class.admin-dashboard-panel--active]="active"
  [class.admin-dashboard-panel--hidden]="!active"
  [attr.aria-hidden]="!active"
>
  <div class="admin-dashboard-panel__head">
    <div>
      <h2>Global data</h2>
      <p class="muted">
        Datos compartidos por todos los idiomas: tipo, estado, slug, fechas, tags, relaciones y
        media.
      </p>
    </div>
    <span class="admin-dashboard-panel__pill">Compartido</span>
  </div>

  <div class="grid">
    <label class="field">
      <span>Tipo</span>
      <select [(ngModel)]="form.type" (ngModelChange)="onFormChange()" name="type">
        @for (type of types; track type) {
          <option [value]="type">{{ type }}</option>
        }
      </select>
    </label>

    <label class="field">
      <span>Status</span>
      <select [(ngModel)]="form.status" (ngModelChange)="onFormChange()" name="status">
        @for (status of statuses; track status) {
          <option [value]="status">{{ status }}</option>
        }
      </select>
    </label>

    <label class="field">
      <span>Nivel</span>
      <select [(ngModel)]="form.contentLevel" (ngModelChange)="onFormChange()" name="contentLevel">
        <option value="">—</option>
        @for (level of levels; track level) {
          <option [value]="level">{{ level }}</option>
        }
      </select>
    </label>

    <label class="field">
      <span>Año inicio</span>
      <input
        type="number"
        [(ngModel)]="form.startYear"
        (ngModelChange)="onFormChange()"
        name="startYear"
      />
    </label>

    <label class="field">
      <span>Año fin</span>
      <input
        type="number"
        [(ngModel)]="form.endYear"
        (ngModelChange)="onFormChange()"
        name="endYear"
      />
    </label>

    <div></div>

    <label class="field full">
      <span>Título base ES</span>
      <input
        type="text"
        [(ngModel)]="form.title"
        (ngModelChange)="onTitleChange($event)"
        name="title"
      />
    </label>

    <label class="field full">
      <span>Slug</span>
      <input
        type="text"
        [(ngModel)]="form.slug"
        (ngModelChange)="onSlugChange($event)"
        name="slug"
      />
      <small class="hint">URL única y neutral para todos los idiomas.</small>
    </label>

    @if (isEdit) {
      <app-admin-entity-translation-editor
        [entityId]="entityId"
        [entityType]="form.type"
        [translations]="translations"
        [localizedDetails]="localizedDetails"
        [details]="details"
        (draftChange)="onTranslationDraftChange($event)"
        (saved)="translationSaved.emit($event)"
      ></app-admin-entity-translation-editor>

      <app-admin-entity-taxonomy-editor
        [entityId]="entityId"
        [tags]="tags"
        [aliases]="aliases"
        (stateChange)="onTaxonomyStateChange($event)"
      ></app-admin-entity-taxonomy-editor>
    } @else {
      <label class="field full">
        <span>Resumen inicial ES</span>
        <textarea
          rows="5"
          [(ngModel)]="form.summary"
          (ngModelChange)="onFormChange()"
          name="summary"
        ></textarea>
        <small class="hint">{{ summaryHint() }}</small>
      </label>

      <label class="field full content-field">
        <span>{{ contentLabel() }}</span>
        <textarea
          #contentTextarea
          rows="14"
          [(ngModel)]="form.content"
          (input)="onContentInput()"
          (keydown.escape)="closeLinkSuggestions()"
          name="content"
        ></textarea>
        <small class="hint">{{ contentHint() }}</small>

        @if (form.type === 'ARTICLE') {
          <div class="article-cheatsheet">
            <div class="article-cheatsheet__head">
              <strong>Sintaxis rápida</strong>
              <span>Se renderiza en la vista pública del artículo.</span>
            </div>

            <div class="article-cheatsheet__grid">
              <div class="article-cheatsheet__item">
                <code># Título</code>
                <span>Título grande</span>
              </div>
              <div class="article-cheatsheet__item">
                <code>## Sección</code>
                <span>Subtítulo</span>
              </div>
              <div class="article-cheatsheet__item">
                <code>&gt; Cita destacada</code>
                <span>Quote editorial</span>
              </div>
              <div class="article-cheatsheet__item">
                <code>**texto**</code>
                <span>Negrita</span>
              </div>
              <div class="article-cheatsheet__item">
                <code>*texto*</code>
                <span>Cursiva</span>
              </div>
              <div class="article-cheatsheet__item">
                <code>[[guernica|obra]]</code>
                <span>Enlace con preview</span>
              </div>
              <div class="article-cheatsheet__item article-cheatsheet__item--wide">
                <code>:::lead ... :::</code>
                <span>Párrafo de apertura más grande</span>
              </div>
            </div>
          </div>
        }

        <app-admin-entity-link-suggestions
          [visible]="showLinkSuggestions"
          [loading]="linkLoading"
          [query]="linkSearch"
          [items]="linkSuggestions"
          (selectItem)="insertEntityLink($event)"
        ></app-admin-entity-link-suggestions>
      </label>
    }
  </div>

  @if (supportsTypedDetails()) {
    <app-admin-entity-details-editor
      [entityId]="entityId"
      [entityType]="form.type"
      [details]="details"
      (detailsChange)="onDetailsChange($event)"
      (statusChange)="detailsStatusChange.emit($event)"
      (saved)="detailsSaved.emit($event)"
    ></app-admin-entity-details-editor>
  }
</section>
