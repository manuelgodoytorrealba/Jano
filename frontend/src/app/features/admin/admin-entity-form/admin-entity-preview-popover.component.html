@if (visible) {
  <div class="entity-preview-popover">
    @if (loading) {
      <div class="muted">Cargando preview…</div>
    }

    @if (!loading && previewData) {
      <h4>{{ previewData.title }}</h4>

      @if (previewData.summary) {
        <p>{{ previewData.summary }}</p>
      }
    }
  </div>
}
