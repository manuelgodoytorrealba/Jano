<ng-container *ngIf="isAuthRoute(); else appLayout">
  <!-- 🔥 AUTH LAYOUT (LOGIN FULLSCREEN) -->
  <router-outlet />
</ng-container>

<ng-template #appLayout>
  <!-- 🔥 APP NORMAL -->
  <div class="app-shell" [class.app-shell--immersive]="isImmersiveRoute()"
    [class.app-shell--entities]="isEntitiesRoute()"
    [class.app-shell--detail]="isEntityDetailRoute()"
    [style.--app-background-image]="backgroundImageStyle()">
    <app-app-chrome />

    <main class="app-shell__content">
      <router-outlet />
    </main>
  </div>
</ng-template>
