<header class="app-chrome__header app-glass">
  <a class="app-chrome__brand" routerLink="/" aria-label="Ir al inicio de JANO">
    <span class="app-chrome__brand-mark">J</span>
    <span class="app-chrome__brand-copy">
      <span class="app-chrome__brand-name">JANO</span>
      <span class="app-chrome__brand-tag">Art discovery system</span>
    </span>
  </a>

  <form class="app-chrome__search" role="search" (submit)="onSearchSubmit($event, searchInput.value)">
    <span class="app-chrome__search-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <path d="M10.5 5.5a5 5 0 1 0 0 10a5 5 0 0 0 0-10Z" fill="none" stroke="currentColor" stroke-width="1.8" />
        <path d="m14 14 4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </svg>
    </span>
    <input
      #searchInput
      class="ds-input app-chrome__search-input"
      type="search"
      placeholder="Buscar artistas, obras, artículos, movimientos o conceptos"
      aria-label="Buscar en JANO"
    />
  </form>

  <nav
    class="app-chrome__nav"
    [class.has-active]="activeNavIndex() >= 0"
    aria-label="Navegación principal"
    [style.--active-index]="activeNavIndex()"
  >
    <span class="app-chrome__nav-indicator" aria-hidden="true"></span>
    @for (item of navItems; track item.label) {
      @if ($index === 4) {
        <span class="app-chrome__nav-separator" aria-hidden="true"></span>
      }
      @if (item.kind === 'route') {
        <a
          class="app-chrome__nav-link"
          [class.is-active]="isRouteActive(item)"
          [class.app-chrome__nav-link--personal]="item.group === 'personal'"
          [routerLink]="targetRoute(item)"
        >
          {{ item.label }}
        </a>
      } @else {
        <button type="button" class="app-chrome__nav-link is-placeholder" (click)="preventPlaceholderAction($event)">
          {{ item.label }}
        </button>
      }
    }
  </nav>

</header>

<aside
  class="app-chrome__utility app-glass"
  [class.has-active]="activeUtilityIndex() >= 0"
  aria-label="Utilidades"
  [style.--active-index]="activeUtilityIndex()"
>
  <span class="app-chrome__utility-indicator" aria-hidden="true"></span>
  @for (item of visibleUtilityItems(); track item.label) {
    @if (item.kind === 'route') {
      <a
        class="app-chrome__utility-btn"
        [class.is-active]="isUtilityActive(item)"
        [routerLink]="targetRoute(item)"
        [attr.aria-label]="item.label"
        [title]="item.label"
      >
        <span class="app-chrome__utility-icon" [attr.data-icon]="item.icon" aria-hidden="true"></span>
      </a>
    } @else {
      <button
        type="button"
        class="app-chrome__utility-btn is-placeholder"
        [attr.aria-label]="item.label"
        [title]="item.label"
        (click)="preventPlaceholderAction($event)"
      >
        <span class="app-chrome__utility-icon" [attr.data-icon]="item.icon" aria-hidden="true"></span>
      </button>
    }
  }
</aside>
