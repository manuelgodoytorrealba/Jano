@if (src) {
  <div class="jano-media__viewport">
    @for (requestId of [imageRequestId]; track requestId) {
      <div
        class="jano-media__reveal"
        [class.is-ready]="state() === 'ready'"
        [class.is-priority]="priority === 'high'"
      >
        <img
          #image
          class="jano-media__img"
          [attr.data-media-request]="requestId"
          [src]="imageSrc"
          [attr.srcset]="srcset"
          [attr.sizes]="srcset ? sizes : null"
          [alt]="altText"
          [attr.loading]="loadingAttr"
          [attr.fetchpriority]="fetchPriorityAttr"
          [attr.width]="widthAttr"
          [attr.height]="heightAttr"
          decoding="async"
          [style.object-fit]="objectFit"
          [style.object-position]="objectPosition"
          [style.transform-origin]="imageTransformOrigin"
          [style.transform]="imageTransform"
          [style.filter]="imageFilter"
          (load)="onImageLoad($event)"
          (error)="onImageError($event)"
        />
      </div>
    }
  </div>
} @else {
  <div class="jano-media__placeholder" aria-hidden="true"></div>
}
