services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jano}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jano123}
      POSTGRES_DB: ${POSTGRES_DB:-jano}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - jano_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jano} -d ${POSTGRES_DB:-jano}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ../backend/api
      target: dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:4200}
      DATABASE_URL: postgresql://${POSTGRES_USER:-jano}:${POSTGRES_PASSWORD:-jano123}@db:5432/${POSTGRES_DB:-jano}?schema=public
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      CHOKIDAR_USEPOLLING: "true"
    working_dir: /app
    command: >
      sh -c "if [ ! -d node_modules/.bin ]; then npm ci; fi &&
      npx prisma generate &&
      npx prisma migrate deploy &&
      npm run start:dev"
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - ../backend/api:/app
      - backend_node_modules:/app/node_modules
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ../frontend
      target: dev
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: development
      PORT: 4200
      API_PROXY_TARGET: http://backend:3000
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    working_dir: /app
    command: >
      sh -c "if [ ! -d node_modules/.bin ]; then npm ci; fi &&
      npm run start:host"
    ports:
      - "${FRONTEND_PORT:-4200}:4200"
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules

  adminer:
    image: adminer
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${ADMINER_PORT:-8080}:8080"

volumes:
  jano_pgdata:
  backend_node_modules:
  backend_uploads:
  frontend_node_modules:
